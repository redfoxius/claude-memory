site_name: claude-memory
site_description: Shared, curated semantic memory for Claude Code (Go, Postgres/pgvector, Ollama, MCP).
site_url: https://redfoxius.github.io/claude-memory/
repo_url: https://github.com/redfoxius/claude-memory
repo_name: redfoxius/claude-memory
copyright: Apache License 2.0

# Pages are assembled from the repository's Markdown by site/build.py.
docs_dir: _src
site_dir: _site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

nav:
  - Overview: index.md
  - Getting started:
      - Install: install.md
      - Usage: usage.md
      - Ollama: ollama.md
      - MCP registration: mcp-registration.md
      - Server (Postgres): deploy.md
  - Project:
      - Security: security.md
      - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
