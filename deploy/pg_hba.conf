# claude-memory pg_hba.conf — first matching line wins.
#
# TYPE  DATABASE        USER            ADDRESS          METHOD

# Inside the container: `docker exec -u postgres ...` (backups, admin) via peer auth.
local   all             postgres                         peer
local   all             all                              scram-sha-256

# Healthcheck (pg_isready only probes, it never authenticates).
host    all             all             127.0.0.1/32     scram-sha-256

# Laptop(s) over Tailscale: app role, app database only.
host    claude_memory   claude_memory   100.64.0.0/10    scram-sha-256

# Everything else is rejected.
host    all             all             0.0.0.0/0        reject
host    all             all             ::/0             reject
