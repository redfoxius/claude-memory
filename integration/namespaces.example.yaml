# Normally created by `claude-memory namespaces init` / `namespaces add`.
# Hand-edit if you prefer; copy to ~/.config/claude-memory/namespaces.yaml
#
# Resolution order for the namespace of a project directory:
#   1. MEMORY_NAMESPACE env var (e.g. in a repo's .claude/settings.json "env")
#   2. the most specific matching path glob below (longest literal prefix wins;
#      "**" matches any number of directories; "~" is your home directory)
#   3. `default:`
#   4. built-in "global" (when no namespace can be chosen, records are shared)
#
# Records from different namespaces never mix: search, dedup, list and
# lookups by id are all scoped to the resolved namespace. The special
# "global" namespace is searched in addition to your own, and is where
# records land when no namespace can be chosen — so map every project you
# care about, or company-specific facts will end up shared. You can also
# write to it explicitly with memory_store namespace="global".
#
# NOTE: existing records were backfilled to "work" by the upgrade
# migration; map your Acme directories to it or they stay invisible.
default: global
namespaces:
  - namespace: work
    paths: ["~/work/acme/**"]
  - namespace: pet-game
    paths: ["~/src/pet-game", "~/src/pet-game/**"]

  # Optional PR-ingest settings per namespace (ingest-pr):
  # - namespace: sandbox
  #   paths: ["~/src/sandbox/**"]
  #   pr_ingest:
  #     enabled: false        # skip this namespace's repos
  # - namespace: corp
  #   paths: ["~/work/corp/**"]
  #   pr_ingest:
  #     provider: gitlab      # self-hosted GitLab (azuredevops|github|gitlab)
  # Keep this section when you edit the file by hand; an old claude-memory
  # binary re-rendering the file drops it (upgrade all binaries).
